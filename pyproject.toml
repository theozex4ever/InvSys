# Tool configuration only: InvSys is an application, not a distributable package.
# Every gate CI enforces is configured here so local runs and CI cannot drift.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -ra: summarize every non-pass at the end. Strict flags turn typos in markers or
# config into errors instead of silently ignored settings.
addopts = ["-ra", "--tb=short", "--strict-markers", "--strict-config"]
xfail_strict = true
# Warnings are bugs: an unclosed SQLite handle surfaces as ResourceWarning.
filterwarnings = ["error"]
# A hung Qt event loop fails one test quickly instead of burning the job timeout.
timeout = 60

[tool.coverage.run]
branch = true
source = ["inventory_control"]
# The native smoke probes are test code driven by the desktop E2E job.
omit = ["inventory_control/desktop_smoke.py", "inventory_control/desktop_smoke_ui.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet: raise this when coverage rises; never lower it to make a PR pass.
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
files = ["inventory_control", "inventory_desktop.py", "inventory_visualizer.py"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = []

# The domain core (store, ledger, bridge, ORM, import/export, backup) is held to
# --strict: it owns every inventory invariant. The Qt widget layer and the native
# smoke probes are excluded until PySide6's enum stubs stop producing false
# positives; shrink this list, never grow it.
[[tool.mypy.overrides]]
module = ["inventory_control.ui.*", "inventory_control.desktop_smoke", "inventory_control.desktop_smoke_ui", "inventory_control.app"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true

[tool.uv]
# Lock output format can change between uv minor versions; CI pins the same line.
required-version = ">=0.11,<0.12"
