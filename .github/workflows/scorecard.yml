# OpenSSF Scorecard: an external, repeatable grade of this repository's
# supply-chain hygiene (pinned dependencies, token permissions, branch
# protection, CI tests, SAST...). Published to the public Scorecard API so the
# README badge reflects the current state.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  # Re-score when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the published result (Sigstore)
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
