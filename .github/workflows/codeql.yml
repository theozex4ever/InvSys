# Semantic code scanning (SAST). Results appear under Security → Code scanning
# and as PR annotations. Not merge-blocking: the live rulesets have no
# code-scanning rule yet (see docs/ci.md, "One required check").
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # Weekly, so new queries catch issues in unchanged code.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload analysis results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # "actions" scans these workflows for injection and permission flaws.
        language: [python, javascript-typescript, actions]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
