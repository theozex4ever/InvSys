# Pull-request and main-branch quality gate. Design notes: docs/ci.md
#
# Every job below feeds the single "CI gate" job at the bottom; branch
# protection requires only that check, so adding, renaming or re-matrixing a
# job can never silently drop it from the merge requirements.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # Weekly run of main surfaces drift nobody pushed: new CVEs in locked
    # dependencies and runner-image changes.
    - cron: "17 7 * * 1"
  workflow_dispatch:

# Deny everything by default; each job asks for exactly what it needs.
permissions: {}

# A new push to a PR supersedes that PR's previous run, and a new manual dispatch
# supersedes the previous one on the same non-main branch (agents dispatch CI on
# branches without a PR). Every other event, including any run on main, gets its
# own group (run_id), so no run on main is ever cancelled or skipped.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    && format('dispatch-{0}', github.ref)
    || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  FORCE_COLOR: "1"
  # Runtime libraries PySide6 needs on Ubuntu, offscreen and under Xvfb.
  QT_APT_PACKAGES: >-
    libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
    libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
    libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock.txt

      - name: Install CI tools (hash-locked)
        run: python -m pip install --require-hashes -r requirements-ci.lock.txt

      - name: actionlint (syntax, expressions, embedded shell)
        run: actionlint -color

      # actionlint only sees `run:` blocks; the repository's own shell scripts
      # are checked with the runner image's shellcheck.
      - name: shellcheck (scripts)
        run: shellcheck scripts/*.sh

      - name: zizmor (workflow security)
        env:
          # Online audits look up known-vulnerable action versions.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github --persona=pedantic .

  python-static:
    name: Python static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format (ruff)
        run: ruff format --check --diff .

      - name: Type-check domain core (mypy --strict)
        run: mypy

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Lock files match their inputs
        run: |
          scripts/lock.sh
          if ! git diff --exit-code -- requirements.lock.txt requirements-ci.lock.txt requirements-package.lock.txt; then
            echo "::error::A lock file is stale or hand-edited. Run scripts/lock.sh and commit the result."
            exit 1
          fi

  python-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14"]
        include:
          # The operator app is a desktop app: prove it on every desktop OS
          # at the minimum supported Python.
          - os: windows-2025
            python: "3.12"
          - os: macos-15
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
      # Coverage is measured on one leg only. Python 3.14 traces branches with
      # sys.monitoring, so this leg runs at near full speed; the older-Python
      # legs would roughly double their runtime under coverage tracing.
      MEASURE_COVERAGE: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.14' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # word-splitting the package list is intended
          sudo apt-get install --no-install-recommends -y -qq $QT_APT_PACKAGES

      - name: Install dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements.lock.txt

      # Random order (pytest-randomly), warnings as errors, 60 s per-test timeout
      # and the coverage floor all come from pyproject.toml, so a local
      # `python -m pytest --cov` enforces the same. The order seed is derived
      # from the commit, so every leg and every re-run of one commit runs the
      # same order; reproduce locally with the seed printed in the header.
      - name: Run tests
        env:
          # Reports go to the runner's temp dir so the checkout must stay clean.
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          cov_args=()
          if [ "$MEASURE_COVERAGE" = true ]; then
            cov_args=(--cov --cov-report=term --cov-report=xml:"$RUNNER_TEMP/coverage.xml")
          fi
          # xunit1 records each test's file and line for the annotations step.
          python -m pytest "${cov_args[@]}" \
            --randomly-seed="$((16#${GITHUB_SHA:0:8}))" \
            -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/junit.xml"

      # One annotation per failing test: `gh run view <id>` lists them under
      # the jobs, so a failure is readable without downloading the log. GitHub
      # keeps the first 10 errors per step; the log's summary has the rest.
      - name: Annotate failing tests
        if: ${{ failure() }}
        run: python scripts/junit_annotations.py "$RUNNER_TEMP/junit.xml"

      - name: Tests left the checkout untouched
        run: |
          # Tests must not write into the repository: no operational database,
          # backups, exports or logs, tracked, untracked or ignored. Only
          # interpreter and tool caches are expected.
          leaked="$(git status --porcelain --ignored --untracked-files=all \
            | grep -vE '(__pycache__/|\.pyc$|^!! \.(pytest|mypy|ruff)_cache/)' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::The test run wrote into the checkout: $(echo "$leaked" | tr '\n' ' ')"
            exit 1
          fi

      - name: Coverage summary
        if: ${{ !cancelled() && env.MEASURE_COVERAGE == 'true' }}
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          {
            echo "### Coverage (branch, domain + UI)"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: no dependency install hook can run code in CI.
      - name: Install dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-fund

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Type-check (strict tsc)
        run: npm run check

      - name: Build
        run: npm run build:assets

      - name: Assets are self-contained and within budget
        run: npm run check:dist

      - name: Build is reproducible
        run: |
          sha256sum dist/* > "$RUNNER_TEMP/first.sha256"
          rm -rf dist
          npm run build:assets > /dev/null
          if ! sha256sum --check --quiet "$RUNNER_TEMP/first.sha256"; then
            echo "::error::Two builds of the same commit produced different assets."
            exit 1
          fi

      # Build once, test that exact artifact: the desktop E2E job downloads
      # these bytes rather than rebuilding them.
      - name: Upload built assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  desktop-e2e:
    name: Desktop E2E (native smoke)
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_API: pyside6
      QTWEBENGINE_CHROMIUM_FLAGS: --force-prefers-reduced-motion
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install display server and Qt WebEngine libraries
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # word-splitting the package list is intended
          sudo apt-get install --no-install-recommends -y -qq xvfb xauth $QT_APT_PACKAGES
          # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's
          # sandbox needs. Re-allow them instead of running with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Smoke run 1 (fresh database)
        run: |
          # Outside the checkout: the smoke writes a real database, backups,
          # logs and screenshots.
          SMOKE_DIR="$RUNNER_TEMP/invsys-smoke"
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_DIR"
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python inventory_desktop.py --database "$SMOKE_DIR/inventory.db" --smoke-check

      - name: Smoke run 2 (restart on existing data)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python inventory_desktop.py --database "$SMOKE_DIR/inventory.db" --smoke-check
          # The second launch must take a startup backup of the existing database.
          compgen -G "$SMOKE_DIR/backups/inventory-*-startup.db" > /dev/null \
            || { echo "::error::No startup backup was written on restart."; exit 1; }

      - name: Upload screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke
          path: |
            ${{ env.SMOKE_DIR }}/smoke-captures/
            ${{ env.SMOKE_DIR }}/logs/
          retention-days: 14
          if-no-files-found: warn

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The Windows and macOS packaging tickets add their runners here and
        # extend scripts/package_bundle.py; the steps below are the shared shape.
        os: [ubuntu-24.04]
    env:
      QTWEBENGINE_CHROMIUM_FLAGS: --force-prefers-reduced-motion
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-package.lock.txt

      - name: Install display server and Qt WebEngine libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # word-splitting the package list is intended
          sudo apt-get install --no-install-recommends -y -qq xvfb xauth $QT_APT_PACKAGES
          # Chromium's sandbox needs unprivileged user namespaces (blocked by default
          # on Ubuntu 24.04); the offline check also runs the bundle in a fresh one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install packaging dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements-package.lock.txt

      # The exact bytes the frontend job built and tested, not a rebuild.
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build standalone bundle
        run: >-
          python scripts/package_bundle.py build
          --assets frontend/dist
          --dist "$RUNNER_TEMP/bundle-dist"
          --work "$RUNNER_TEMP/bundle-work"

      - name: Build left the checkout untouched
        run: |
          leaked="$(git status --porcelain --ignored --untracked-files=all \
            | grep -vE '^(!!|\?\?) frontend/dist/' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::The package build wrote into the checkout: $(echo "$leaked" | tr '\n' ' ')"
            exit 1
          fi

      # Failure behaviour, then two native runs of the frozen bundle against one
      # disposable inventory (second run: restart persistence and startup backup),
      # inside an empty network namespace so any network use fails outright.
      - name: Package smoke
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          python scripts/package_bundle.py smoke
          --bundle "$RUNNER_TEMP/bundle-dist/invsys-desktop"
          --assets frontend/dist
          --workdir "$RUNNER_TEMP/invsys-package-smoke"
          --evidence "$RUNNER_TEMP/package-evidence.json"
          --isolate-network

      - name: Package evidence summary
        if: ${{ !cancelled() }}
        run: |
          # The smoke may have failed before writing its record.
          [ -f "$RUNNER_TEMP/package-evidence.json" ] || exit 0
          {
            echo "### Package smoke (${RUNNER_OS})"
            echo '```json'
            python -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d[k] for k in ('result','machine','network_isolated')}, indent=2))" "$RUNNER_TEMP/package-evidence.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/package-evidence.json
            ${{ runner.temp }}/bundle-dist/invsys-desktop/bundle-manifest.json
            ${{ runner.temp }}/invsys-package-smoke/inventory/smoke-captures/
            ${{ runner.temp }}/invsys-package-smoke/inventory/logs/
          retention-days: 14
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock.txt

      - name: Install CI tools (hash-locked)
        run: python -m pip install --require-hashes -r requirements-ci.lock.txt

      - name: Audit Python lock (OSV + PyPI advisories)
        run: |
          pip-audit --strict --progress-spinner=off --disable-pip --require-hashes \
            -r requirements.lock.txt -r requirements-ci.lock.txt
          # The bundle toolchain is a separate hash-locked set (same runtime pins).
          pip-audit --strict --progress-spinner=off --disable-pip --require-hashes \
            -r requirements-package.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Audit npm lock
        working-directory: frontend
        run: npm audit --audit-level=low --package-lock-only

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Blocks a PR that *introduces* a vulnerable or low-trust dependency,
      # comparing the PR's manifests against its base.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - workflow-lint
      - python-static
      - python-tests
      - frontend
      - desktop-e2e
      - package-smoke
      - dependency-audit
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Only these jobs may legitimately be skipped (they are PR-only).
          SKIPPABLE: dependency-review
        run: |
          failed=0
          while IFS=$'\t' read -r job result; do
            if [ "$result" = success ]; then
              echo "pass  $job"
            elif [ "$result" = skipped ] && [[ " $SKIPPABLE " == *" $job "* ]]; then
              echo "skip  $job (not applicable to ${GITHUB_EVENT_NAME})"
            else
              echo "::error::$job finished with result: $result"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          exit "$failed"
